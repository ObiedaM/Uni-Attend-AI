name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v2.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verify, Security Audit, Package & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${{ steps.meta.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability check
        run: npm audit --audit-level=moderate

      - name: Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build, Security Audit & Package Release ZIP + SHA256SUMS
        run: npm run package

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: UniAttend AI ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release/UniAttend-AI-v*.zip
            release/SHA256SUMS.txt
